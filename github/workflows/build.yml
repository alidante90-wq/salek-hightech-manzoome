name: Build SALEK HIGHTECH

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JUCE on Linux needs these system dev libs (ALSA, X11, WebKit, etc.)
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev \
            ninja-build

      - name: Install Ninja (Windows/macOS)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@master

      # Cache JUCE + build objects between runs so CI doesn't refetch/rebuild
      # everything (JUCE itself, plus our own object files) on every push.
      - name: Cache CMake build dir
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # ---- Locate + stage the actual plugin binaries per platform ----

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging/VST3 staging/Standalone
          find build -iregex '.*SALEK HIGHTECH\.vst3' -exec cp -r {} staging/VST3/ \;
          find build -iregex '.*SALEK HIGHTECH\.exe' -exec cp {} staging/Standalone/ \;

      - name: Stage artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p staging/VST3 staging/AU staging/Standalone
          find build -iregex '.*SALEK HIGHTECH\.vst3' -exec cp -r {} staging/VST3/ \;
          find build -iregex '.*SALEK HIGHTECH\.component' -exec cp -r {} staging/AU/ \;
          find build -iregex '.*SALEK HIGHTECH\.app' -exec cp -r {} staging/Standalone/ \;

      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staging/VST3 staging/Standalone
          find build -iregex '.*SALEK HIGHTECH\.vst3' -exec cp -r {} staging/VST3/ \;
          find build -type f -iname 'SALEK HIGHTECH' -exec cp {} staging/Standalone/ \;

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SalekHightech-${{ matrix.name }}
          path: staging/**
          if-no-files-found: error
